[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-impact-center-base"
version = "0.1.0"
description = "AI Impact Center 를 위한 베이스라인 코드입니다."
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy>=1.24.4",
    "pandas>=1.3.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "pathlib>=1.0.1",
    "opencv-python>=4.6.0.66",
    "opencv-python-headless>=4.11.0.86",
    "timm>=1.0.15",
    "datasets>=3.1.0",
    "scikit-learn>=1.3.2",
    "tqdm>=4.67.1"
]

[tool.uv]
environments = [
    "sys_platform == 'linux'"
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.setuptools.packages.find]
include = ["model_pipeline*"]
